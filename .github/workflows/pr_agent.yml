name: PR-Agent Test

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  pr_review_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: PR-Agent Review with Gemini
        id: pragent
        uses: qodo-ai/pr-agent@main
        env:
          GCP_API_KEY: ${{ secrets.GCP_API_KEY }}  # Store Gemini API key as a secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: "gemini-pro"  # Use Gemini instead of OpenAI models
